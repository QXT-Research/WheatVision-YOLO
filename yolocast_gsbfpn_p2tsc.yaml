# 消融补充 F：标准 v8s Backbone + GS-BiFPN Neck(P2-P5) + P2-TSCHead
# 两两组合之三：完整模型的颈部与头部，不含 C2f-CILA
nc: 12

backbone:
  - [-1, 1, Conv, [32, 3, 2]]       # 0  P1/2
  - [-1, 1, Conv, [64, 3, 2]]       # 1  P2/4
  - [-1, 1, C2f, [64, 1]]           # 2  P2 out
  - [-1, 1, Conv, [128, 3, 2]]      # 3  P3/8
  - [-1, 1, C2f, [128, 2]]          # 4  P3 out
  - [-1, 1, Conv, [256, 3, 2]]      # 5  P4/16
  - [-1, 1, C2f, [256, 2]]          # 6  P4 out
  - [-1, 1, Conv, [256, 3, 2]]      # 7  P5/32
  - [-1, 1, C2f, [256, 2]]          # 8
  - [-1, 1, SPPF, [512, 5]]         # 9  P5 out

head:
  - [6, 1, Conv, [128, 1]]          # 10 P4->C
  - [9, 1, Conv, [128, 1]]          # 11 P5->C
  - [4, 1, Conv, [128, 1]]          # 12 P3->C
  - [2, 1, Conv, [128, 1]]          # 13 P2->C
  # 自顶向下
  - [[10, 11], 1, GSFuse, [128, ['none', 'up2']]]   # 14 T4
  - [[12, 14], 1, GSFuse, [128, ['none', 'up2']]]   # 15 T3
  - [[13, 15], 1, GSFuse, [128, ['none', 'up2']]]   # 16 T2 = B2
  # 自底向上
  - [[12, 15, 16], 1, GSFuse, [128, ['none', 'none', 'down2']]]  # 17 B3
  - [[10, 14, 17], 1, GSFuse, [128, ['none', 'none', 'down2']]]  # 18 B4
  - [[11, 18], 1, GSFuse, [128, ['none', 'down2']]]              # 19 B5
  - [[16, 17, 18, 19], 1, P2TSCDetect, [12, 128]]                # 20
