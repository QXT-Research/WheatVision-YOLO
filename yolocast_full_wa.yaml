# YOLO-CAST 宽度自适应版：C2f-CILA Backbone + WA-GS-BiFPN Neck(P2-P5) + P2-TSCHead
# 修复版：Neck 各层保留渐进宽度 {P2:128, P3:128, P4:256, P5:256}，替代固定 128 通道压缩
nc: 12

backbone:
  - [-1, 1, Conv, [32, 3, 2]]       # 0  P1/2
  - [-1, 1, Conv, [64, 3, 2]]       # 1  P2/4
  - [-1, 1, C2f_CILA, [64, 1]]      # 2  P2 out
  - [-1, 1, Conv, [128, 3, 2]]      # 3  P3/8
  - [-1, 1, C2f_CILA, [128, 2]]     # 4  P3 out
  - [-1, 1, Conv, [256, 3, 2]]      # 5  P4/16
  - [-1, 1, C2f_CILA, [256, 2]]     # 6  P4 out
  - [-1, 1, Conv, [256, 3, 2]]      # 7  P5/32
  - [-1, 1, C2f_CILA, [256, 2]]     # 8
  - [-1, 1, SPPF, [512, 5]]         # 9  P5 out

head:
  # 横向投影：P2/P3 -> 128，P4 -> 256，P5 -> 512 投影到 256
  - [2, 1, Conv, [128, 1]]          # 10 P2->C2
  - [4, 1, Conv, [128, 1]]          # 11 P3->C3
  - [6, 1, Conv, [256, 1]]          # 12 P4->C4
  - [9, 1, Conv, [256, 1]]          # 13 P5->C4（512 压到 256，保留深层容量）
  # 自顶向下（式 11）
  - [[12, 13], 1, GSFuse, [256, ['none', 'up2']]]   # 14 T4 (256)
  - [14, 1, Conv, [128, 1]]                         # 15 T4->C3
  - [[11, 15], 1, GSFuse, [128, ['none', 'up2']]]   # 16 T3 (128)
  - [[10, 16], 1, GSFuse, [128, ['none', 'up2']]]   # 17 T2 = B2 (128)
  # 自底向上（式 11）
  - [[11, 16, 17], 1, GSFuse, [128, ['none', 'none', 'down2']]]  # 18 B3 (128)
  - [18, 1, Conv, [256, 1]]                                      # 19 B3->C4
  - [[12, 14, 19], 1, GSFuse, [256, ['none', 'none', 'down2']]]  # 20 B4 (256)
  - [20, 1, Conv, [256, 1]]                                      # 21 B4->C5'
  - [[13, 21], 1, GSFuse, [256, ['none', 'down2']]]              # 22 B5 (256)
  # P2/P3/P4/P5 四级任务解耦检测头（输入宽度各异，头内部 1x1 统一）
  - [[17, 18, 20, 22], 1, P2TSCDetect, [12, 128]]                # 23
