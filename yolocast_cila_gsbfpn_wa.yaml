# 消融补充 G：C2f-CILA Backbone + WA-GS-BiFPN Neck(P3-P5) + 标准 Detect
# 宽度自适应验证：与 yolocast_cila_gsbfpn.yaml 拓扑完全一致，仅把固定 C=128
# 改为渐进宽度 {P3:128, P4:256, P5:256}，用于隔离"宽度压缩"这一单一变量
nc: 12

backbone:
  - [-1, 1, Conv, [32, 3, 2]]       # 0  P1/2
  - [-1, 1, Conv, [64, 3, 2]]       # 1  P2/4
  - [-1, 1, C2f_CILA, [64, 1]]      # 2  P2 out
  - [-1, 1, Conv, [128, 3, 2]]      # 3  P3/8
  - [-1, 1, C2f_CILA, [128, 2]]     # 4  P3 out
  - [-1, 1, Conv, [256, 3, 2]]      # 5  P4/16
  - [-1, 1, C2f_CILA, [256, 2]]     # 6  P4 out
  - [-1, 1, Conv, [256, 3, 2]]      # 7  P5/32
  - [-1, 1, C2f_CILA, [256, 2]]     # 8
  - [-1, 1, SPPF, [512, 5]]         # 9  P5 out

head:
  # 横向投影：P3 -> 128，P4 -> 256，P5(512) -> 256
  - [6, 1, Conv, [256, 1]]          # 10 P4->C4
  - [9, 1, Conv, [256, 1]]          # 11 P5->C4
  - [4, 1, Conv, [128, 1]]          # 12 P3->C3
  # 自顶向下
  - [[10, 11], 1, GSFuse, [256, ['none', 'up2']]]   # 13 T4 (256)
  - [13, 1, Conv, [128, 1]]                         # 14 T4->C3
  - [[12, 14], 1, GSFuse, [128, ['none', 'up2']]]   # 15 T3 (128)
  # 自底向上
  - [[12, 15], 1, GSFuse, [128, ['none', 'none']]]              # 16 B3 (128)
  - [16, 1, Conv, [256, 1]]                                     # 17 B3->C4
  - [[10, 13, 17], 1, GSFuse, [256, ['none', 'none', 'down2']]] # 18 B4 (256)
  - [[11, 18], 1, GSFuse, [256, ['none', 'down2']]]             # 19 B5 (256)
  - [[16, 18, 19], 1, Detect, [12]]                             # 20
