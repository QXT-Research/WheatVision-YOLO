# 消融补充 E：C2f-CILA Backbone + 扩展到 P2 的标准 PAN + P2-TSCHead
# 两两组合之二，不引入 GS-BiFPN，颈部保持标准 PAN 结构
nc: 12

backbone:
  - [-1, 1, Conv, [32, 3, 2]]       # 0  P1/2
  - [-1, 1, Conv, [64, 3, 2]]       # 1  P2/4
  - [-1, 1, C2f_CILA, [64, 1]]      # 2  P2 out
  - [-1, 1, Conv, [128, 3, 2]]      # 3  P3/8
  - [-1, 1, C2f_CILA, [128, 2]]     # 4  P3 out
  - [-1, 1, Conv, [256, 3, 2]]      # 5  P4/16
  - [-1, 1, C2f_CILA, [256, 2]]     # 6  P4 out
  - [-1, 1, Conv, [256, 3, 2]]      # 7  P5/32
  - [-1, 1, C2f_CILA, [256, 2]]     # 8
  - [-1, 1, SPPF, [512, 5]]         # 9  P5 out

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11
  - [-1, 1, C2f, [256]]                         # 12
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14
  - [-1, 1, C2f, [128]]                         # 15
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 16
  - [[-1, 2], 1, Concat, [1]]                   # 17
  - [-1, 1, C2f, [64]]                          # 18 P2 out
  - [-1, 1, Conv, [64, 3, 2]]                   # 19
  - [[-1, 15], 1, Concat, [1]]                  # 20
  - [-1, 1, C2f, [128]]                         # 21 P3 out
  - [-1, 1, Conv, [128, 3, 2]]                  # 22
  - [[-1, 12], 1, Concat, [1]]                  # 23
  - [-1, 1, C2f, [256]]                         # 24 P4 out
  - [-1, 1, Conv, [256, 3, 2]]                  # 25
  - [[-1, 9], 1, Concat, [1]]                   # 26
  - [-1, 1, C2f, [512]]                         # 27 P5 out
  - [[18, 21, 24, 27], 1, P2TSCDetect, [12, 128]]  # 28
